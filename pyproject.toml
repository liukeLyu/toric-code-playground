[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toric-code-playground"
version = "0.1.0.dev0"
description = "The toric code from scratch: make, braid and decode anyons by hand, checked against exact state vectors"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Liuke Lyu" }]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
examples = ["jupyter", "matplotlib"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib", "nbclient", "ipykernel"]

[tool.hatch.build.targets.wheel]
packages = ["src/toric"]

[tool.pytest.ini_options]
markers = ["slow: tens of seconds each (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_notebooks.py" = ["E501"]  # notebook prose and markdown tables
